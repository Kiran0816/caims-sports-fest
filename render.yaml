services:
  - type: web
    name: caims-sports-fest
    runtime: node
    plan: free
    buildCommand: npm run install:all && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: caims-db
          property: connectionString
      - key: DATABASE_SSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_INITIAL_PASSWORD
        value: "caimsfest2026#"
      - key: TRUST_PROXY
        value: "1"

databases:
  - name: caims-db
    plan: free
    databaseName: caims
    user: caims
